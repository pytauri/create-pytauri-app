_subdirectory: "templates/"

project_name:
  type: str
  help: Project name
  default: pytauri-app

package_name:
  type: str
  default: "{{ project_name | replace('-', '_')}}"
  when: false

identifier:
  type: str
  help: Identifier
  default: "com.username.{{ project_name }}"

with_rust:
  type: bool
  help: Do you want to use Rust?
  default: false

template:
  type: str
  help: Choose your UI template
  choices:
    Vue: vue
    React: react
    Svelte: svelte
  default: vue

_frontend_path:
  type: str
  default: "{% if with_rust == true %}.{% else %}./app{% endif %}"
  when: false

_message_after_copy: |
  Template created! To get started run:
      cd {{ project_name }}
      pnpm install
      uv venv --python-preference only-system
      {%- if _copier_conf.os == "windows" %}
      .venv\Scripts\activate
      {%- else %}
      source .venv/bin/activate
      {%- endif %}
      uv sync

  For Desktop development, run:
      pnpm tauri dev

  For building a standalone app, see the `scripts/` folder.
